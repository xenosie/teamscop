name: E2E

# CI contract: docs/09-INSTALL-DEPLOY.md
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # Pinned to the projects' EF Core version. A newer tool would build the model with a different
  # runtime than the one the snapshot was generated by, and disagree for uninteresting reasons.
  EF_TOOL_VERSION: "8.0.11"

jobs:
  linux-api-e2e:
    name: Linux API + Engine E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # C1 — the seven [PostgresFact] tests exercise what the in-memory provider cannot model: unique
    # indexes that actually reject, ExecuteDeleteAsync, and a replay of the whole migration chain
    # into an empty database. With no server here they set Skip, and a skip reads exactly like a
    # pass in the summary line — which is how six migrations, a dropped column set and a new table
    # reached this repo with zero automated coverage.
    services:
      postgres:
        image: postgres:16
        env:
          # Deliberately not the deployed API's role, and never reachable from it: the fixtures
          # CREATE and DROP databases. Matches the role PostgresTestServer documents for local runs.
          POSTGRES_USER: teamscop_test
          POSTGRES_PASSWORD: teamscop_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # The job's steps do not start until this reports healthy. -h forces TCP, which the
        # entrypoint's bootstrap server deliberately does not listen on, so "healthy" cannot mean
        # "still initialising".
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U teamscop_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 5s

    env:
      # The contract PostgresTestServer reads: a maintenance connection it can CREATE DATABASE
      # from. Each fixture gets its own scratch database off this and drops it afterwards.
      TEAMSCOP_TEST_PG: "Host=127.0.0.1;Port=5432;Database=postgres;Username=teamscop_test;Password=teamscop_test"
      # Turns "no PostgreSQL" from a silent skip into a failed run. Set only where a server is
      # promised — a developer machine without one still skips and runs the rest of the suite.
      TEAMSCOP_REQUIRE_PG: "1"
      # A named database for the migration checks, kept apart from the fixtures' scratch ones.
      MIGRATION_CONNECTION: "Host=127.0.0.1;Port=5432;Database=teamscop_ci_migrations;Username=teamscop_test;Password=teamscop_test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install EF Core tools
        run: |
          dotnet tool install --global dotnet-ef --version "$EF_TOOL_VERSION" \
            || dotnet tool update --global dotnet-ef --version "$EF_TOOL_VERSION" --allow-downgrade
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore Teamscop.sln

      - name: Build
        # 0 errors AND 0 warnings is a project rule (docs/09-INSTALL-DEPLOY.md); enforced here
        # rather than trusted. Warnings get fixed, never suppressed.
        run: dotnet build Teamscop.sln -c Release --no-restore -warnaserror

      # ---------------------------------------------------------------------------------------
      # Schema gates. Both run before the tests: a broken migration should be a red step with the
      # failing SQL in it, not a puzzling test failure — and least of all a production restart.
      # ASPNETCORE_ENVIRONMENT=Development supplies the dev signing keys Program.cs demands before
      # it will build a host; ConnectionStrings__Default overrides that environment's "InMemory"
      # so the real Npgsql provider is used.
      # ---------------------------------------------------------------------------------------
      - name: Apply the full migration chain to a real PostgreSQL
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Default: ${{ env.MIGRATION_CONNECTION }}
        run: |
          dotnet ef database update \
            --project backend/Teamscop.Api \
            --startup-project backend/Teamscop.Api \
            --configuration Release --no-build

      - name: Assert every migration applied
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Default: ${{ env.MIGRATION_CONNECTION }}
        run: |
          dotnet ef migrations list \
            --project backend/Teamscop.Api \
            --startup-project backend/Teamscop.Api \
            --configuration Release --no-build | tee migrations.txt
          if grep -q '(Pending)' migrations.txt; then
            echo "::error::A migration is still pending after 'database update' — the chain did not apply cleanly."
            exit 1
          fi

      - name: Assert the model matches the migrations
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Default: ${{ env.MIGRATION_CONNECTION }}
        run: |
          # The failure mode that bit this project twice: an entity edited, no migration added, and
          # the divergence discovered by a deploy. Needs the relational provider (not InMemory) so
          # the model is built the same way AppDbContextModelSnapshot.cs was generated.
          if ! dotnet ef migrations has-pending-model-changes \
            --project backend/Teamscop.Api \
            --startup-project backend/Teamscop.Api \
            --configuration Release --no-build; then
            echo "::error::The EF model has changes with no migration behind them. Add a migration and update AppDbContextModelSnapshot.cs — never edit an existing migration."
            exit 1
          fi

      - name: Test (unit + API e2e + PostgreSQL persistence)
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: >
          dotnet test Teamscop.sln
          -c Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Assert no test skipped
        # The suite has no legitimately skipped test, so a skip means the PostgreSQL-backed ones
        # went missing again. Without this, losing the service container is invisible: the run
        # stays green and only the coverage quietly disappears.
        run: |
          python3 - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET

          ns = "{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}"
          files = sorted(glob.glob("**/TestResults/**/*.trx", recursive=True))
          if not files:
              sys.exit("No .trx was produced — the test step did not run.")

          total = executed = passed = failed = 0
          skipped = []
          for path in files:
              root = ET.parse(path).getroot()
              counters = root.find(f"{ns}ResultSummary/{ns}Counters")
              if counters is None:
                  sys.exit(f"{path} has no counters element.")
              total += int(counters.get("total", 0))
              executed += int(counters.get("executed", 0))
              passed += int(counters.get("passed", 0))
              failed += int(counters.get("failed", 0))
              # A skip lands on the individual result; the Counters element leaves notExecuted at
              # 0 and merely shrinks "executed", which is precisely how this went unnoticed.
              skipped += [r.get("testName", "?") for r in root.iter(f"{ns}UnitTestResult")
                          if r.get("outcome") == "NotExecuted"]

          line = f"total={total} executed={executed} passed={passed} failed={failed} skipped={len(skipped)}"
          print(line)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(f"### Tests\n\n`{line}`\n")

          if skipped or total != executed:
              for name in skipped:
                  print(f"::error::skipped: {name}")
              sys.exit(
                  f"{len(skipped) or total - executed} test(s) were skipped. The [PostgresFact] tests "
                  "are the only ones that can: check the postgres service container, TEAMSCOP_TEST_PG "
                  "and TEAMSCOP_REQUIRE_PG."
              )
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: |
            **/TestResults/**
            **/coverage.cobertura.xml

  windows-agent-build:
    name: Windows Agent + UI Build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # One solution build covers every engine, every agent host, the Avalonia app, the setup
      # program and the API — all net8.0, so this is the only place the Windows-only P/Invoke and
      # registry paths are compiled by a Windows SDK.
      - name: Build solution
        run: dotnet build Teamscop.sln -c Release

      # Service containers are Linux-only on GitHub-hosted runners, so the seven [PostgresFact]
      # tests skip here by design and TEAMSCOP_REQUIRE_PG is deliberately not set. Their coverage
      # lives in linux-api-e2e; this run is about the engine tests behaving on Windows.
      - name: Run engine/API tests on Windows
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: >
          dotnet test backend/Teamscop.Api.Tests/Teamscop.Api.Tests.csproj
          -c Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=windows-test-results.trx"

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: "**/TestResults/**"

      # Dry run of what deploy/windows/build-setup.sh feeds into Teamscop_setup.exe. The five
      # executables below are the installer payload; a project that stops publishing one of them
      # breaks the installer, and nothing else in CI would notice. Framework-dependent here on
      # purpose — the real build is self-contained, and this job must not emit something that
      # could be mistaken for a shippable installer (it has no company token key).
      - name: Publish staff layout (installer input dry-run)
        run: |
          $out = "artifacts/staff-agent"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $projects = @(
            "agent/Teamscop.StaffService/Teamscop.StaffService.csproj",
            "agent/Teamscop.SessionHelper/Teamscop.SessionHelper.csproj",
            "agent/Teamscop.App/Teamscop.App.csproj",
            "agent/Teamscop.UsbApproval/Teamscop.UsbApproval.csproj",
            "agent/Teamscop.UninstallGuard/Teamscop.UninstallGuard.csproj"
          )
          foreach ($p in $projects) {
            dotnet publish $p -c Release -r win-x64 --self-contained false -o $out
            if ($LASTEXITCODE -ne 0) { throw "publish failed: $p" }
          }
          $exes = @(
            "Teamscop.StaffService.exe",
            "Teamscop.SessionHelper.exe",
            "Teamscop.App.exe",
            "Teamscop.UsbApproval.exe",
            "Teamscop.UninstallGuard.exe"
          )
          foreach ($e in $exes) {
            if (-not (Test-Path "$out/$e")) { throw "installer payload is missing $e" }
          }

      - name: Upload staff publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: staff-agent-win-x64
          path: artifacts/staff-agent
          if-no-files-found: error

  linux-app-build:
    name: Linux Avalonia App Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Teamscop.App (Release)
        run: dotnet build agent/Teamscop.App/Teamscop.App.csproj -c Release

      - name: Build SessionHelper (portable)
        run: dotnet build agent/Teamscop.SessionHelper/Teamscop.SessionHelper.csproj -c Release

  live-smoke:
    name: Live smoke (teamscop.com)
    runs-on: ubuntu-latest
    # Read-only by design (B18). This job used to sign up an admin + a staff member on
    # production on every merge to main. Per spec §1.7 there is no delete path and never
    # will be, so every merge permanently added a company. It now only asks production
    # whether it is alive; behavioural coverage lives in linux-api-e2e against an
    # ephemeral instance. Do not add any request here that writes.
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    timeout-minutes: 5
    steps:
      - name: Health check
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://teamscop.com/health | tee health.json
          grep -q '"status":"ok"' health.json

      - name: Anonymous surface is reachable and rejects unauthenticated reads
        run: |
          set -euo pipefail
          BASE=https://teamscop.com
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$BASE/api/tracking/staff")
          test "$CODE" = "401"
          echo "LIVE_SMOKE_OK"

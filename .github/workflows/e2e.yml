name: E2E

# Full plan: docs/CI_CD_E2E.md
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-api-e2e:
    name: Linux API + Engine E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Teamscop.sln

      - name: Build
        run: dotnet build Teamscop.sln -c Release --no-restore

      - name: Test (unit + API e2e)
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: >
          dotnet test Teamscop.sln
          -c Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: |
            **/TestResults/**
            **/coverage.cobertura.xml

  windows-agent-build:
    name: Windows Agent + UI Build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build engines
        run: |
          dotnet build agent/Teamscop.Engine.Auth/Teamscop.Engine.Auth.csproj -c Release
          dotnet build agent/Teamscop.Engine.Lifecycle/Teamscop.Engine.Lifecycle.csproj -c Release
          dotnet build agent/Teamscop.Engine.Sync/Teamscop.Engine.Sync.csproj -c Release
          dotnet build agent/Teamscop.Engine.Tracking/Teamscop.Engine.Tracking.csproj -c Release
          dotnet build agent/Teamscop.Engine.Usb/Teamscop.Engine.Usb.csproj -c Release

      - name: Build agent hosts
        run: |
          dotnet build agent/Teamscop.StaffService/Teamscop.StaffService.csproj -c Release
          dotnet build agent/Teamscop.SessionHelper/Teamscop.SessionHelper.csproj -c Release
          dotnet build agent/Teamscop.AdminHost/Teamscop.AdminHost.csproj -c Release
          dotnet build agent/Teamscop.UninstallGuard/Teamscop.UninstallGuard.csproj -c Release
          dotnet build agent/Teamscop.UsbApproval/Teamscop.UsbApproval.csproj -c Release

      - name: Build Avalonia App
        run: dotnet build agent/Teamscop.App/Teamscop.App.csproj -c Release

      - name: Publish staff layout (installer input dry-run)
        run: |
          $out = "artifacts/staff-agent"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish agent/Teamscop.StaffService/Teamscop.StaffService.csproj -c Release -r win-x64 --self-contained false -o $out
          dotnet publish agent/Teamscop.SessionHelper/Teamscop.SessionHelper.csproj -c Release -r win-x64 --self-contained false -o $out
          dotnet publish agent/Teamscop.App/Teamscop.App.csproj -c Release -r win-x64 --self-contained false -o $out
          Test-Path "$out/Teamscop.StaffService.exe"
          Test-Path "$out/Teamscop.SessionHelper.exe"
          Test-Path "$out/Teamscop.App.exe"

      - name: Upload staff publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: staff-agent-win-x64
          path: artifacts/staff-agent
          if-no-files-found: error

      - name: Run engine/API tests on Windows
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: >
          dotnet test backend/Teamscop.Api.Tests/Teamscop.Api.Tests.csproj
          -c Release
          --verbosity normal
          --logger "trx;LogFileName=windows-test-results.trx"

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: "**/TestResults/**"

  linux-app-build:
    name: Linux Avalonia App Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Teamscop.App (Release)
        run: dotnet build agent/Teamscop.App/Teamscop.App.csproj -c Release

      - name: Build SessionHelper (portable)
        run: dotnet build agent/Teamscop.SessionHelper/Teamscop.SessionHelper.csproj -c Release

  live-smoke:
    name: Live smoke (teamscop.com)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Health check
        run: |
          set -euo pipefail
          curl -fsS https://teamscop.com/health | tee health.json
          grep -q '"status":"ok"' health.json

      - name: Auth + tracking + chain smoke
        run: |
          set -euo pipefail
          BASE=https://teamscop.com
          ADMIN_DK=$(python3 - <<'PY'
          import hashlib, uuid
          print(hashlib.sha256(uuid.uuid4().bytes + uuid.uuid4().bytes).hexdigest())
          PY
          )
          STAFF_DK=$(python3 - <<'PY'
          import hashlib, uuid
          print(hashlib.sha256(uuid.uuid4().bytes + uuid.uuid4().bytes).hexdigest())
          PY
          )
          ADMIN=$(curl -fsS -X POST "$BASE/api/auth/admin/signup" \
            -F "deviceKey=$ADMIN_DK" -F "username=CI Smoke $(date +%s)" -F "password=password123")
          echo "$ADMIN" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["accessToken"]; assert d["companyToken"].startswith("TS1.")'
          ACCESS=$(echo "$ADMIN" | python3 -c 'import sys,json; print(json.load(sys.stdin)["accessToken"])')
          CT=$(echo "$ADMIN" | python3 -c 'import sys,json; print(json.load(sys.stdin)["companyToken"])')
          STAFF=$(curl -fsS -X POST "$BASE/api/auth/staff/signup" \
            -F "deviceKey=$STAFF_DK" -F "username=CI Staff" -F "password=password123" -F "companyToken=$CT")
          STAFF_ID=$(echo "$STAFF" | python3 -c 'import sys,json; print(json.load(sys.stdin)["user"]["id"])')
          STAFF_ACCESS=$(echo "$STAFF" | python3 -c 'import sys,json; print(json.load(sys.stdin)["accessToken"])')

          curl -fsS -X PUT "$BASE/api/tracking/config/$STAFF_ID" \
            -H "Authorization: Bearer $ACCESS" -H 'Content-Type: application/json' \
            -d "{\"staffUserId\":\"$STAFF_ID\",\"screenshotQuality\":2,\"screenshotPeriodSeconds\":180,\"timeTrackEnabled\":true,\"browserHistoryEnabled\":true,\"screenshotEnabled\":true,\"configVersion\":0}" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["screenshotPeriodSeconds"]==180'

          curl -fsS "$BASE/api/tracking/config/me" -H "Authorization: Bearer $STAFF_ACCESS" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["screenshotEnabled"] is True'

          curl -fsS "$BASE/api/police/me" -H "Authorization: Bearer $STAFF_ACCESS" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); assert "packages" in d'

          # Admin can read chain health for staff
          curl -fsS "$BASE/api/tracking/chain/$STAFF_ID" -H "Authorization: Bearer $ACCESS" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["staffUserId"]; assert "agentOffline" in d'

          # Staff cannot monitor self via chain
          CODE=$(curl -sS -o /tmp/chain_self.json -w "%{http_code}" \
            "$BASE/api/tracking/chain/$STAFF_ID" -H "Authorization: Bearer $STAFF_ACCESS")
          test "$CODE" = "403"

          # Staff self timetrack (sticker) allowed
          FROM=$(python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          print((datetime.now(timezone.utc)-timedelta(hours=24)).strftime("%Y-%m-%dT%H:%M:%SZ"))
          PY
          )
          TO=$(python3 - <<'PY'
          from datetime import datetime, timezone
          print(datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))
          PY
          )
          curl -fsS "$BASE/api/tracking/timetrack?staffUserId=$STAFF_ID&from=$FROM&to=$TO" \
            -H "Authorization: Bearer $STAFF_ACCESS" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); assert "segments" in d'

          # Staff list must never include self (plain staff → empty list)
          export STAFF_ID
          curl -fsS "$BASE/api/tracking/staff" -H "Authorization: Bearer $STAFF_ACCESS" \
            | python3 -c 'import sys,json,os; d=json.load(sys.stdin); sid=os.environ["STAFF_ID"]; assert isinstance(d,list); assert all(x.get("userId")!=sid for x in d)'

          echo "LIVE_SMOKE_OK"

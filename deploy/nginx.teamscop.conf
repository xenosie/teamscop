limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

server {
    listen 80;
    listen [::]:80;
    server_name teamscop.com www.teamscop.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name teamscop.com www.teamscop.com;

    ssl_certificate /etc/letsencrypt/live/teamscop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teamscop.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Ingest batches are capped at 8 MiB of payload server-side; leave headroom for the
    # JSON envelope so nginx never rejects a batch the service would have accepted.
    client_max_body_size 12m;

    # Avatars are NOT served from disk. They go through GET /api/media/avatars/{fileName},
    # which authorizes the caller like any other staff data (B12).
    #
    # This block used to alias /var/lib/teamscop/avatars/ directly, with `expires 7d` and
    # `Cache-Control: public`. nginx matches a location before it ever proxies, so leaving it here
    # would have silently defeated the authenticated route the moment it deployed — the photos
    # would still have been readable by anyone with a URL, and cached publicly on top.

    # Unknown/legacy scanner traffic — drop without consuming API rate budget.
    location /api/monitor/ {
        access_log off;
        return 404;
    }

    location /api/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 12m;
    }

    location /health {
        proxy_pass http://127.0.0.1:5080/health;
        proxy_set_header Host $host;
    }

    location /hubs/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 200 'Teamscop API is online.\n';
        add_header Content-Type text/plain;
    }
}

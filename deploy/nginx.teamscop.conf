limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name teamscop.com www.teamscop.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name teamscop.com www.teamscop.com;

    ssl_certificate /etc/letsencrypt/live/teamscop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teamscop.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 8m;

    location /media/avatars/ {
        alias /var/lib/teamscop/avatars/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/ {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:5080/health;
        proxy_set_header Host $host;
    }

    location / {
        return 200 'Teamscop API is online.\n';
        add_header Content-Type text/plain;
    }
}
